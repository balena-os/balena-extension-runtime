      nested: []
    - subject: "runtime: accept the kill --all flag"
      hash: f68f12a71afa0be1c70730815c05af5088b84d6e
      body: >
        containerd passes --all on the force delete path.


        The flag is ignored as a container is a single proxy process spawned
        with

        Setpgid that never forks, so it is the only member of its group;


        Rejecting the flag made the engine return 500 on teardown, leaving
        callers retrying

        against a container that could never be cleaned up.
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: Alex Gonzalez <alexg@balena.io>
        signed-off-by: Alex Gonzalez <alexg@balena.io>
      author: Alex Gonzalez
      nested: []
